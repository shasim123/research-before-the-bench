<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Before the Bench | Interactive Simulation</title><style>body{font-family:Arial,Helvetica,sans-serif;background:#f6f8fb;color:#1d2733;margin:0;padding:40px 16px}.wrap{max-width:830px;margin:auto}.card{background:white;border:1px solid #dce1e8;border-radius:18px;padding:28px;box-shadow:0 8px 26px #172a4510}h1{font-size:25px;margin:0 0 8px}p{line-height:1.65}header p{color:#5b6877;margin:0 0 25px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{background:#edf1f5;border-radius:15px;padding:5px 11px;font-size:12px}.progress{display:flex;gap:6px;margin:18px 0 12px}.bar{height:5px;flex:1;border-radius:6px;background:#e3e9f0}.bar.active{background:#4d91c9}.count{font-size:12px;color:#627184;letter-spacing:.06em}h2{font-size:21px;margin:13px 0}#question{min-height:65px}.answer{background:#eef5fc;border-left:4px solid #4d91c9;padding:16px;border-radius:7px;margin:15px 0}.answer h3{font-size:15px;margin:0}.controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px}button{background:white;border:1px solid #ccd4dd;border-radius:24px;padding:11px 18px;font-weight:600;cursor:pointer;color:#344354}button.primary{background:#172331;color:white;border-color:#172331}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid #4d91c9}footer{font-size:12px;color:#687688;margin-top:17px}@media(max-width:500px){.card{padding:19px}.controls button{padding:10px 12px}}</style></head><body><main class="wrap"><header><h1>Research Before the Bench</h1><p>AI-assisted research rehearsal · Interactive example for master's students</p></header><section class="card"><div class="top"><strong>Example of an interactive research simulation</strong><span class="tag">Illustrative</span></div><div class="progress" id="progress" aria-label="Scenario progress"></div><div class="count" id="count"></div><h2 id="title"></h2><p id="question"></p><div class="answer" id="answer" hidden><h3>Expected scientific reasoning</h3><p id="reasoning"></p><strong id="skill"></strong></div><div class="controls"><button id="prev">← Previous</button><button id="reveal" aria-expanded="false">Show reasoning</button><button id="next" class="primary">Next →</button></div></section><footer>Teaching demonstration. Simulated outcomes are illustrative and do not represent actual research findings.</footer></main><script>const scenarios=[{title:'Round 1 — Design the experiment',question:'You want to determine whether caspofungin treatment increases β-glucan exposure in Candida auris. What experimental controls and measurements are needed?',reasoning:'Identify untreated and treated controls, staining controls, viability measurements, biological replicates, and a quantitative method for measuring β-glucan exposure. Explain why each is necessary.',skill:'Learning outcome: Experimental design and scientific rigor'},{title:'Round 2 — Unexpected results',question:'Your simulated results show increased β-glucan exposure after treatment. However, cell viability is also reduced. Can you conclude that treatment specifically induces β-glucan unmasking?',reasoning:'Not yet. Consider whether the increased signal reflects cell wall remodeling or cell damage. Propose confirmatory experiments and additional controls before drawing a conclusion.',skill:'Learning outcome: Critical thinking and interpretation'},{title:'Round 3 — Reproducibility challenge',question:'Your first experiment shows a strong increase in β-glucan exposure, but the next two independent experiments show inconsistent results. What would you do before accepting your conclusion?',reasoning:'Review experimental conditions, biological variability, staining procedures, instrument settings, controls, and raw data. Plan additional independent replication and document all outcomes without selectively excluding unfavorable results.',skill:'Learning outcome: Reproducibility and troubleshooting'},{title:'Round 4 — Defend the conclusion',question:'You have completed the virtual experiments. What conclusions are supported, what remains uncertain, and what should be tested when you begin working in the real laboratory?',reasoning:'Present evidence-based conclusions, acknowledge limitations, identify which results require independent confirmation, and develop a feasible laboratory research plan. The mentor evaluates scientific reasoning and readiness.',skill:'Learning outcome: Scientific reasoning and research readiness'}];let index=0,visible=false;const el=id=>document.getElementById(id);function render(){let s=scenarios[index];el('progress').innerHTML=scenarios.map((_,i)=>`<div class="bar ${i<=index?'active':''}"></div>`).join('');el('count').textContent=`SCENARIO ${index+1} OF ${scenarios.length}`;el('title').textContent=s.title;el('question').textContent=s.question;el('reasoning').textContent=s.reasoning;el('skill').textContent=s.skill;el('answer').hidden=!visible;el('reveal').textContent=visible?'Hide reasoning':'Show reasoning';el('reveal').setAttribute('aria-expanded',String(visible));el('prev').disabled=index===0;el('next').textContent=index===3?'Restart ↻':'Next →'}el('prev').onclick=()=>{if(index>0){index--;visible=false;render()}};el('next').onclick=()=>{index=(index+1)%4;visible=false;render()};el('reveal').onclick=()=>{visible=!visible;render()};render();</script></body></html>
